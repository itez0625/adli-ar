<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamera ve Sensör Testi</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #panel{position:fixed;left:0;right:0;top:0;padding:12px;background:rgba(0,0,0,.6);font-size:14px}
  #btn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
       padding:18px 28px;font-size:20px;border:0;border-radius:12px;background:#1e88e5;color:#fff}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div id="panel">Hazır. "Testi Başlat" düğmesine bas.</div>
<button id="btn">Testi Başlat</button>

<script>
const panel = document.getElementById('panel');
const btn = document.getElementById('btn');
const video = document.getElementById('v');
const log = [];
function say(t){ log.push(t); panel.innerHTML = log.join('<br>'); }

btn.addEventListener('click', async () => {
  btn.style.display = 'none';
  log.length = 0;

  // 1) Sensör izni (iPhone için dokunma içinde istenmeli)
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      say('Sensör izni: ' + r);
    } else {
      say('Sensör izni: gerekmiyor (Android/diğer)');
    }
  } catch (e) { say('Sensör izni HATA: ' + e.message); }

  // 2) Kamera
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    say('Kamera: AÇIK');
  } catch (e) { say('Kamera HATA: ' + e.name + ' - ' + e.message); }

  // 3) Sensör değerleri
  let n = 0;
  const base = log.slice();
  window.addEventListener('deviceorientation', ev => {
    if (++n % 5) return;
    const f = x => (x == null ? 'yok' : x.toFixed(0));
    panel.innerHTML = base.join('<br>') +
      '<br>alfa: ' + f(ev.alpha) + ' | beta: ' + f(ev.beta) + ' | gama: ' + f(ev.gamma) +
      '<br>Telefonu çevirdikçe sayılar değişmeli.';
  });
  setTimeout(() => { if (n === 0) say('Sensör verisi gelmedi!'); }, 2000);
});
</script>
</body>
</html>
